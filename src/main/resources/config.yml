# MatrixStats API configuration.
#
# Exposes a small HTTPS API on loopback that:
#   - delegates AuthMe verify / change-password (POST /verify, POST /change-password)
#   - returns SkinsRestorer skin info       (GET /skin/{username})
#   - returns live player stats             (GET /stats/{username})
#
# All endpoints require the shared secret in the X-Matrix-Api-Secret header.
# Anything left blank below will be auto-generated on first start and written
# back into this file. The generated TLS keystore and exported certificate
# live in the plugin data folder (plugins/MatrixStats/).

api:
  enabled: true

  # Address to bind the HTTPS listener to. 127.0.0.1 is strongly recommended;
  # clients should be on the same host.
  bind-address: 127.0.0.1
  port: 8081

  # Shared secret that clients must send in the X-Matrix-Api-Secret header
  # on every request. Leave blank to auto-generate on first start.
  shared-secret: ""

  # Self-signed TLS material. The keystore is a PKCS12 file. The exported
  # certificate (PEM) is what clients should trust.
  keystore-file: api-keystore.p12
  keystore-password: ""
  cert-export-file: api-cert.pem
  cert-validity-days: 3650
  cert-common-name: localhost

  # How long any Bukkit-main-thread call (AuthMe verify, stats collect, etc.)
  # is allowed to take before we 504 the request, in milliseconds.
  main-thread-timeout-ms: 5000
