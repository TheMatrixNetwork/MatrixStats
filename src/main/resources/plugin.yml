name: MatrixStats
version: ${project.version}
main: org.matrixnetwork.stats.MatrixStats
api-version: '1.21'
authors: [S1mple133, CrashCringle]
description: Local HTTPS API exposing AuthMe, SkinsRestorer, and live player stats
depend: [AuthMe]
# ProjectKorra omitted from softdepend until the integration is re-enabled
# (see commented block in StatsHandler / pom.xml).
softdepend: [Vault, SkinsRestorer, Slimefun, mcMMO]

commands:
  matrixstats:
    description: MatrixStats admin commands
    usage: /<command> reload | regen-secret | regen-cert
    permission: matrixstats.admin

permissions:
  matrixstats.admin:
    description: Manage the MatrixStats API
    default: op
